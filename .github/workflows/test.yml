name: custom code test

on:
  push:
    branches:
      - master
    paths:
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.UdpTest/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - custom/main
    paths:
      - 'v2rayN/**'
      - 'package-osx.sh'
      - '.github/workflows/**'
  push:
    branches:
      - custom/main

permissions:
  contents: read

permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'
    - name: Run ServiceLib tests
      run: dotnet test --project ./v2rayN/ServiceLib.Tests -c Release -- --report-trx
